[package]
name = "chik"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "A meta-crate that exports all of the Chik crates in the workspace."
authors = [
    "Richard Kiss <him@richardkiss.com>",
    "Arvid Norberg <arvid@chiknetwork.com>",
    "Brandon Haggstrom <b.haggstrom@chiknetwork.com>"
]
homepage = "https://github.com/Chik-Network/chik_rs"
repository = "https://github.com/Chik-Network/chik_rs"

[workspace]
members = ["crates/*", "crates/*/fuzz", "wasm", "wheel"]

[workspace.package]
version = "0.48.2"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
future_incompatible = { level = "deny", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "deny"
non_ascii_idents = "deny"
unused_imports = "warn"
unused_import_braces = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"
dead_code = "deny"
deprecated = "deny"
deprecated_in_future = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
wildcard_imports = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
similar_names = "allow"
implicit_hasher = "allow"

# TODO: This will be cleaned up separately
collapsible_if = "allow"

[dependencies]
chik-bls = { workspace = true, optional = true }
chik-secp = { workspace = true, optional = true }
chik-client = { workspace = true, optional = true }
chik-consensus = { workspace = true, optional = true }
chik-datalayer = { workspace = true, optional = true }
chik-protocol = { workspace = true, optional = true }
chik-ssl = { workspace = true, optional = true }
chik-serde = { workspace = true, optional = true }
chik-traits = { workspace = true, optional = true }
chik-puzzle-types = { workspace = true, optional = true }
chik-sha2 = { workspace = true, optional = true }
clvk-traits = { workspace = true, optional = true }
clvk-utils = { workspace = true, optional = true }
clvkr = { workspace = true }

# This is required since clvkr is only added here to provide the openssl feature conditionally.
# In the future we could pass the openssl feature to each of the relevant workspace crates instead.
[package.metadata.cargo-machete]
ignored = ["clvkr"]

[features]
default = [
    "bls",
    "secp",
    "client",
    "consensus",
    "datalayer",
    "protocol",
    "ssl",
    "serde",
    "traits",
    "puzzle-types",
    "sha2",
    "clvk-traits",
    "clvk-utils"
]

bls = ["dep:chik-bls", "clvk-traits/chik-bls"]
secp = ["dep:chik-secp", "clvk-traits/chik-secp"]
client = ["dep:chik-client"]
consensus = ["dep:chik-consensus"]
datalayer = ["dep:chik-datalayer"]
protocol = ["dep:chik-protocol"]
ssl = ["dep:chik-ssl"]
serde = ["dep:chik-serde", "chik-protocol/serde", "chik-bls/serde"]
traits = ["dep:chik-traits"]
puzzle-types = ["dep:chik-puzzle-types"]
sha2 = ["dep:chik-sha2"]
clvk-traits = ["dep:clvk-traits"]
clvk-utils = ["dep:clvk-utils"]

openssl = ["chik-sha2/openssl", "clvkr/openssl"]

[profile.release]
lto = "thin"

[lib]
bench = false

[workspace.dependencies]
chik_py_streamable_macro = { path = "./crates/chik_py_streamable_macro", version = "0.48.2" }
chik_streamable_macro = { path = "./crates/chik_streamable_macro", version = "0.48.2" }
chik-bls = { path = "./crates/chik-bls", version = "0.48.2" }
chik-client = { path = "./crates/chik-client", version = "0.48.2" }
chik-consensus = { path = "./crates/chik-consensus", version = "0.48.2" }
chik-datalayer = { path = "./crates/chik-datalayer", version = "0.48.2" }
chik-datalayer-macro = { path = "./crates/chik-datalayer/macro", version = "0.48.2" }
chik-protocol = { path = "./crates/chik-protocol", version = "0.48.2" }
chik-secp = { path = "./crates/chik-secp", version = "0.48.2" }
chik-ssl = { path = "./crates/chik-ssl", version = "0.48.2" }
chik-traits = { path = "./crates/chik-traits", version = "0.48.2" }
chik-puzzle-types = { path = "./crates/chik-puzzle-types", version = "0.48.2" }
chik-sha2 = { path = "./crates/chik-sha2", version = "0.48.2" }
chik-serde = { path = "./crates/chik-serde", version = "0.48.2" }
clvk-traits = { path = "./crates/clvk-traits", version = "0.48.2" }
clvk-utils = { path = "./crates/clvk-utils", version = "0.48.2" }
clvk-derive = { path = "./crates/clvk-derive", version = "0.48.2" }
chik-pos2 = "0.6.0"
chik-consensus-fuzz = { path = "./crates/chik-consensus/fuzz", version = "0.48.2" }
chik-bls-fuzz = { path = "./crates/chik-bls/fuzz", version = "0.48.2" }
chik-datalayer-fuzz = { path = "./crates/chik-datalayer/fuzz", version = "0.48.2" }
chik-protocol-fuzz = { path = "./crates/chik-protocol/fuzz", version = "0.48.2" }
chik-puzzle-types-fuzz = { path = "./crates/chik-puzzle-types/fuzz", version = "0.48.2" }
clvk-traits-fuzz = { path = "./crates/clvk-traits/fuzz", version = "0.48.2" }
clvk-utils-fuzz = { path = "./crates/clvk-utils/fuzz", version = "0.48.2" }
blst = { version = "0.3.16", features = ["portable"] }
clvkr = "0.19.0"
